name: NUMIA mathematical parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -B -m unittest discover -s backend/tests -t backend -v
      - run: node --check public/assets/app.js
      - run: node qa/frontend_contract.cjs
      - run: node qa/reference_golden.cjs
